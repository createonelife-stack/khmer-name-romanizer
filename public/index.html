<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Khmer Name Romanizer</title>
  <!-- Preconnect and Load Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Metal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="appbar">
    <div class="appbar-title">
      <span class="flag">🇰🇭</span>
      <span>ឈ្មោះខ្មែរ → ឡាតាំង</span>
    </div>
    <span class="appbar-spacer"></span>
    <button id="themeBtn" class="icon-btn" aria-label="ប្តូរពណ៌ងងឹត/ភ្លឺ">
      <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg id="sun-icon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </header>

  <main class="wrap">
    
    <div id="hint" style="text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 15px;">
      Advanced Rule-based Romanization Mode (Reconstructed)
    </div>

    <section class="card glass-card">
      <label class="field-label" for="kh-input">សរសេរ​ឈ្មោះ​ជា​ភាសា​ខ្មែរ (ឧ. សុខ សំណាង)</label>
      <div class="input-row">
        <input id="kh-input" type="text" inputmode="text" autocomplete="off" spellcheck="false"
               placeholder="វាយឈ្មោះនៅទីនេះ...">
        <button id="clearBtn" class="clear-btn" aria-label="សម្អាត">✕</button>
      </div>

      <div class="result">
        <div class="result-label">អក្សរ​ឡាតាំង (ENGLISH)</div>
        <div id="latin-output" class="latin empty">—</div>
        <button id="copyBtn" class="copy-btn">📋 ចម្លង (Copy)</button>
      </div>

      <div class="variants-wrap" id="variants-wrap" style="display:none;">
        <div class="variants-label">ជម្រើស​ផ្សេង (ចុច​ដើម្បី​ជ្រើស)</div>
        <div id="variants" class="variants"></div>
      </div>
    </section>

    <!-- Examples -->
    <div style="margin-top:20px;">
      <div class="variants-label">ឧទាហរណ៍</div>
      <div id="examples" class="variants"></div>
    </div>

    <!-- On-screen keyboard -->
    <div style="margin-top:20px;">
      <div class="variants-label">ក្ដារចុចអក្សរខ្មែរ</div>
      <div id="kbd" class="kbd"></div>
    </div>

  </main>

  <div id="toast" class="toast">បានចម្លងដោយជោគជ័យ!</div>

  <script src="khmer-romanize.js"></script>
  <script src="app.js"></script>
</body>
</html>
